name: CI API

on:
  push:
    paths:
      - 'api-gestor-tareas/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    paths:
      - 'api-gestor-tareas/**'
      - '.github/workflows/ci-api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gestor-tareas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
