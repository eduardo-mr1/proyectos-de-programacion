name: CI Frontend

on:
  push:
    paths:
      - 'frontend-gestor-tareas/**'
  pull_request:
    paths:
      - 'frontend-gestor-tareas/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-gestor-tareas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
